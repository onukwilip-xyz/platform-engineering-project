{{- if .Values.slo.enabled }}
apiVersion: sloth.slok.dev/v1
kind: PrometheusServiceLevel
metadata:
  name: store-ui
  namespace: {{ .Release.Namespace }}
  labels:
    app: store-ui
    team: platform
spec:
  service: "store-ui"
  labels:
    team: platform
    tier: frontend

  slos:

    - name: requests-availability
      objective: {{ .Values.slo.availability.objective }}
      description: >
        {{ .Values.slo.availability.objective }}% of HTTP requests to Store UI
        must complete with a clean response (1xx–4xx, no Envoy transport error)
        over a 30-day window. Errors include 5xx responses, timeouts (UT),
        upstream connection failures (UF/UC), and circuit-breaker overflows (UO)
        recorded by the destination Envoy sidecar.
      sli:
        events:
          errorQuery: >-
            sum(rate(istio_requests_total{
              reporter="destination",
              destination_service_name="{{ .Values.service.name }}",
              destination_service_namespace="{{ .Release.Namespace }}"
            }[{{`{{.window}}`}}]))
            -
            sum(rate(istio_requests_total{
              reporter="destination",
              destination_service_name="{{ .Values.service.name }}",
              destination_service_namespace="{{ .Release.Namespace }}",
              response_code=~"[1234]..",
              response_flags="-"
            }[{{`{{.window}}`}}]))
          totalQuery: >-
            sum(rate(istio_requests_total{
              reporter="destination",
              destination_service_name="{{ .Values.service.name }}",
              destination_service_namespace="{{ .Release.Namespace }}"
            }[{{`{{.window}}`}}]))
      alerting:
        name: StoreUIHighErrorRate
        labels:
          tier: frontend
          service: store-ui
        annotations:
          summary: "Store UI error rate is burning through the error budget"
        pageAlert:
          labels:
            channel: error
            severity: error
        ticketAlert:
          labels:
            channel: warning
            severity: warning

    - name: requests-latency
      objective: {{ .Values.slo.latency.objective }}
      description: >
        {{ .Values.slo.latency.objective }}% of HTTP requests to Store UI must
        complete within {{ .Values.slo.latency.thresholdMs }}ms over a 30-day window.
      sli:
        events:
          # Slow requests = total − requests within threshold bucket
          errorQuery: >-
            sum(rate(istio_requests_total{
              reporter="destination",
              destination_service_name="{{ .Values.service.name }}",
              destination_service_namespace="{{ .Release.Namespace }}"
            }[{{`{{.window}}`}}]))
            -
            sum(rate(istio_request_duration_milliseconds_bucket{
              reporter="destination",
              destination_service_name="{{ .Values.service.name }}",
              destination_service_namespace="{{ .Release.Namespace }}",
              le="{{ .Values.slo.latency.thresholdMs }}"
            }[{{`{{.window}}`}}]))
          totalQuery: >-
            sum(rate(istio_requests_total{
              reporter="destination",
              destination_service_name="{{ .Values.service.name }}",
              destination_service_namespace="{{ .Release.Namespace }}"
            }[{{`{{.window}}`}}]))
      alerting:
        name: StoreUIHighLatency
        labels:
          tier: frontend
          service: store-ui
        annotations:
          summary: "Store UI latency is burning through the error budget"
        pageAlert:
          labels:
            channel: error
            severity: error
        ticketAlert:
          labels:
            channel: scale-workloads
            severity: warning
{{- end }}
