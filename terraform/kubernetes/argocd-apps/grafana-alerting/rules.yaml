              refId: B
              expression: A
              reducer: last
              settings:
                mode: dropNN
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 300
              to: 0
            model:
              type: threshold
              refId: C
              expression: B
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
  # ── SLO Burn Rate Alerts ─────────────────────────────────────────────────────
  # Multi-window burn rate alerts generated from Sloth recording rules.
  # Threshold formula: burn_rate × (1 - objective_ratio)
  # Page  (fast burn): 14.4× — short window 5m, long window 1h
  # Ticket (slow burn):  6×  — short window 30m, long window 6h
  # noDataState=OK: SLO is vacuously satisfied when no traffic flows.
  # Adjust thresholds here once actual recording rule labels are confirmed.

  - orgId: 1
    name: slo-alerts
    folder: Platform Alerts
    interval: 1m
    rules:

    # ── users-microservice / requests-availability (99.5% SLO) ──────────────────

    - uid: slo-users-availability-page
      title: 'SLO: Users Service Availability Fast Burn (>14.4×)'
      condition: D
      noDataState: OK
      execErrState: Error
      for: 2m
      labels:
        channel: critical
        severity: critical
      annotations:
        summary: 'Users service burning availability error budget at >14.4× rate'
