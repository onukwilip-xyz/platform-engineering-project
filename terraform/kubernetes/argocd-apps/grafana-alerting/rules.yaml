                - evaluator:
                    params: [0]
                    type: gt

      - uid: statefulset-zero-replicas-critical
        title: StatefulSet Zero Replicas (critical namespaces)
        condition: C
        for: 2m
        labels:
          channel: critical
          severity: critical
        annotations:
          summary: 'CRITICAL: StatefulSet {{ $labels.namespace }}/{{ $labels.statefulset }} has 0 ready replicas'
