            datasourceUid: prometheus-main
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: 'kube_deployment_status_replicas_ready{namespace=~"${critical_namespaces}"} == 0'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 300
              to: 0
            model:
              type: reduce
              refId: B
              expression: A
              reducer: last
              settings:
                mode: dropNN
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 300
