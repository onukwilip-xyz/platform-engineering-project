              expression: A
              reducer: last
              settings:
                mode: dropNN
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 300
              to: 0
            model:
              type: threshold
              refId: C
              expression: B
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
  
  # ── SLO Burn Rate Alerts ─────────────────────────────────────────────────────
  
  - orgId: 1
    name: slo-alerts
    folder: Platform Alerts
    interval: 1m
    rules:

    - uid: slo-users-availability-page
      title: 'SLO: Users Service Availability Fast Burn'
      condition: F
      noDataState: OK
      execErrState: Error
      for: 2m
      labels:
        channel: critical
        severity: critical
      annotations:
        summary: 'Users service burning availability error budget too fast'
        description: >
          Pair1 — 1h: {{ $values.A.Value | printf "%.4f" }},
          5m: {{ $values.B.Value | printf "%.4f" }}.
          Pair2 — 6h: {{ $values.C.Value | printf "%.4f" }},
          30m: {{ $values.D.Value | printf "%.4f" }}.
          At fast burn rate, 30-day budget exhausts in ~2 days.
      data:
        - refId: A
          datasourceUid: prometheus-main
