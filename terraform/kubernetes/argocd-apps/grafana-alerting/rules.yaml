        data:
          - refId: A
            datasourceUid: prometheus-main
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: 'cnpg_cluster_ready_instances == 0'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
