name: "Terraform Reusable Pipeline"

permissions:
  contents: read
  id-token: write

on:
  workflow_call:
    inputs:
      github-environment:
        type: string
        required: true
      connect-vpn:
        type: boolean
        required: false
        default: false
      action:
        type: string
        required: false
        default: "apply"
      iac-tool:
        type: string
        required: false
        default: "terragrunt"
      working-directory:
        type: string
        required: true
      gcp-project-id:
        type: string
        required: true
      netbird-management-url:
        type: string
        required: false
      tfvars-secret-override:
        description: "Override the GSM secret name for tfvars. Falls back to vars.TF_VARS_SECRET if omitted."
        type: string
        required: false
        default: ""

jobs:
  terraform:
    name: "${{ inputs.action }} (${{ inputs.github-environment }})"
    runs-on: ubuntu-latest
    environment: ${{ inputs.github-environment }}

    env:
      TF_NETWORK_SA_EMAIL: ${{ vars.TF_NETWORK_SA_EMAIL }}
      TF_PLATFORM_SA_EMAIL: ${{ vars.TF_PLATFORM_SA_EMAIL }}
      SUBNET_KEY: ${{ vars.SUBNET_KEY }}
      DDOS_PROTECTION: ${{ vars.DDOS_PROTECTION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      # terragrunt: anchored at the environment root so find_in_parent_folders(".tfvars")
      # resolves for every unit regardless of this job's own working-directory scope
      # (whole env vs just its kubernetes/ subtree), and so the "project"/"gke" readiness
      # check below (which always targets those units directly) can find it too.
      # terraform (shared layer only): no env/kubernetes split to worry about, so it
      # just writes relative to its own working-directory, as before.
      ENV_TFVARS_PATH: ${{ inputs.iac-tool == 'terragrunt' && format('{0}/terraform/envs/{1}/.tfvars', github.workspace, inputs.github-environment) || '.tfvars' }}

    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to GCP via WIF
        uses: google-github-actions/auth@v2
        with:
          service_account: ${{ vars.CICD_SA_EMAIL }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Install Terragrunt
        if: inputs.iac-tool == 'terragrunt'
        shell: bash
        run: |
          curl -fsSL \
            "https://github.com/gruntwork-io/terragrunt/releases/latest/download/terragrunt_linux_amd64" \
            -o /usr/local/bin/terragrunt
          chmod +x /usr/local/bin/terragrunt

      - name: Write tfvars from Secret Manager
        shell: bash
        env:
          SECRET_NAME: ${{ (inputs.tfvars-secret-override != '' && inputs.tfvars-secret-override) || vars.TF_VARS_SECRET }}
          PROJECT_ID: ${{ inputs.gcp-project-id }}
        run: |
          gcloud secrets versions access latest \
            --secret="$SECRET_NAME" \
            --project="$PROJECT_ID" > "$ENV_TFVARS_PATH"

      - name: Connect to NetBird VPN
        if: inputs.connect-vpn == true
        uses: ./.github/actions/netbird-connect
        with:
          management-url: ${{ inputs.netbird-management-url }}
          setup-key-secret: ${{ vars.NETBIRD_CICD_KEY_SECRET }}
          secret-project-id: ${{ vars.HOST_PROJECT_ID }}
          tf-network-sa-email: ${{ vars.TF_NETWORK_SA_EMAIL }}

      - name: Check whether project/gke units are already applied
        id: check-gke
        if: inputs.iac-tool == 'terragrunt'
        shell: bash
        run: |
          ENV_DIR="$(dirname "$ENV_TFVARS_PATH")"
          SERVICE_PROJECT_ID=$(terragrunt --working-dir "$ENV_DIR/project" run output -raw service_project_id 2>/dev/null || true)
          CLUSTER_NAME=$(terragrunt --working-dir "$ENV_DIR/gke" run output -raw gke_cluster_name 2>/dev/null || true)
          echo "service-project-id=$SERVICE_PROJECT_ID" >> "$GITHUB_OUTPUT"
          echo "cluster-name=$CLUSTER_NAME" >> "$GITHUB_OUTPUT"

      - name: Install gke-gcloud-auth-plugin
        if: inputs.iac-tool == 'terragrunt' && steps.check-gke.outputs.service-project-id != '' && steps.check-gke.outputs.cluster-name != ''
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y google-cloud-cli-gke-gcloud-auth-plugin

      - name: Fetch GKE credentials for kubectl
        if: inputs.iac-tool == 'terragrunt' && steps.check-gke.outputs.service-project-id != '' && steps.check-gke.outputs.cluster-name != ''
        uses: google-github-actions/get-gke-credentials@v2
        env:
          CLOUDSDK_AUTH_IMPERSONATE_SERVICE_ACCOUNT: ${{ vars.TF_PLATFORM_SA_EMAIL }}
        with:
          cluster_name: ${{ steps.check-gke.outputs.cluster-name }}
          location: ${{ vars.GKE_REGION }}
          project_id: ${{ steps.check-gke.outputs.service-project-id }}
          use_internal_ip: true

      - name: Terraform init
        if: inputs.iac-tool == 'terraform'
        run: terraform init -backend-config="bucket=$TF_STATE_BUCKET"

      - name: Run Terraform
        if: inputs.iac-tool == 'terraform'
        run: terraform ${{ inputs.action }} -var-file="$ENV_TFVARS_PATH" -auto-approve

      - name: Run Terragrunt
        if: inputs.iac-tool == 'terragrunt'
        run: terragrunt --non-interactive run --all ${{ inputs.action }}
