# ─────────────────────────────────────────────────────────────────────────────
# Infrastructure Deployment Pipeline
# ─────────────────────────────────────────────────────────────────────────────
# Trigger:      Manual (Actions → Run workflow)
#
# Org Variables (Settings → Secrets & Variables → Actions → Variables):
#   WIF_PROVIDER     – WIF provider resource name
#                      e.g. projects/PROJECT_NUM/locations/global/
#                           workloadIdentityPools/POOL/providers/PROVIDER
#   CICD_SA    – CI/CD service account; authenticates via WIF
#   TF_NETWORK_SA    – TF Network SA email; read by env.hcl / terragrunt.hcl via get_env()
#   TF_PLATFORM_SA   – TF Platform SA email; read by env.hcl / terragrunt.hcl via get_env()
#   TF_STATE_BUCKET  – GCS bucket name for Terraform/Terragrunt remote state
#
# Secrets (per-repo or org-level):
#   SHARED_TFVARS          – Full contents of terraform/shared/.tfvars
#   STAGING_TFVARS         – Full contents of staging .tfvars
#   PRODUCTION_TFVARS      – Full contents of production .tfvars
#   DDOS_SIMULATION_TFVARS – Full contents of terraform/ddos-simulation/staging .tfvars
#
# Notes:
#   - Jobs run in parallel by default. Add `needs: [shared]` to env jobs if
#     shared infra must exist before env modules are applied.
#   - For all terragrunt modules, TF_NETWORK_SA / TF_PLATFORM_SA / TF_STATE_BUCKET
#     are plain env vars (no TF_VAR_ prefix) — they are consumed by get_env() in
#     env.hcl and terragrunt.hcl, not by Terraform variable injection.
#   - terraform/shared uses a partial GCS backend (bucket omitted in backend.tf),
#     so `terraform init` receives the bucket via -backend-config.
# ─────────────────────────────────────────────────────────────────────────────

name: Infrastructure Deployment

on:
  workflow_dispatch:
    inputs:
      # ── Required inputs ────────────────────────────────────────────────────
      branch:
        description: "Branch to deploy from"
        required: true
        type: string

      action:
        description: "Action — 'create' provisions resources, 'destroy' tears them down"
        required: true
        type: choice
        options:
          - create
          - destroy
        default: create

      # ── Module toggles (checkboxes) ────────────────────────────────────────
      shared:
        description: "Shared infrastructure  (terraform/shared)"
        type: boolean
        default: false

      staging:
        description: "Staging environment  (terraform/envs/staging)"
        type: boolean
        default: false

      production:
        description: "Production environment  (terraform/envs/production)"
        type: boolean
        default: false

      ddos_simulation:
        description: "DDoS simulation  (terraform/ddos-simulation/staging)"
        type: boolean
        default: false

# Required for OIDC token exchange (WIF)
permissions:
  id-token: write
  contents: read

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Job 1 · Shared Infrastructure — plain Terraform
  # ───────────────────────────────────────────────────────────────────────────
  shared:
    name: "Shared · ${{ inputs.action == 'create' && 'Apply' || 'Destroy' }}"
    if: ${{ inputs.shared == true }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout — ${{ inputs.branch }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Authenticate to GCP via WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CICD_SA }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Write .tfvars
        working-directory: terraform/shared
        env:
          TFVARS_CONTENT: ${{ secrets.SHARED_TFVARS }}
        run: echo "$TFVARS_CONTENT" > .tfvars

      # backend.tf has the bucket commented out (partial config); pass it at init time.
      - name: Terraform Init
        working-directory: terraform/shared
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: Terraform ${{ inputs.action == 'create' && 'Apply' || 'Destroy' }}
        working-directory: terraform/shared
        run: |
          if [ "${{ inputs.action }}" = "create" ]; then
            terraform apply --auto-approve -var-file=".tfvars"
          else
            terraform destroy --auto-approve -var-file=".tfvars"
          fi

  # ───────────────────────────────────────────────────────────────────────────
  # Job 2 · Staging Environment — Terragrunt run --all
  # ───────────────────────────────────────────────────────────────────────────
  staging:
    name: "Staging · ${{ inputs.action == 'create' && 'Apply' || 'Destroy' }}"
    needs: [shared]
    if: inputs.staging == true && (needs.shared.result == 'success' || needs.shared.result == 'skipped')
    runs-on: ubuntu-latest

    env:
      # Plain env vars — consumed by get_env() in env.hcl; must NOT have TF_VAR_ prefix.
      TF_NETWORK_SA:  ${{ vars.TF_NETWORK_SA }}
      TF_PLATFORM_SA: ${{ vars.TF_PLATFORM_SA }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}

    steps:
      - name: Checkout — ${{ inputs.branch }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Authenticate to GCP via WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CICD_SA }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Setup Terragrunt
        run: |
          curl -sL \
            "https://github.com/gruntwork-io/terragrunt/releases/latest/download/terragrunt_linux_amd64" \
            -o /usr/local/bin/terragrunt
          chmod +x /usr/local/bin/terragrunt
          terragrunt --version

      - name: Write staging.tfvars
        env:
          TFVARS_CONTENT: ${{ secrets.STAGING_TFVARS }}
        run: echo "$TFVARS_CONTENT" > "$GITHUB_WORKSPACE/staging.tfvars"

      - name: Terragrunt ${{ inputs.action == 'create' && 'Apply' || 'Destroy' }}
        working-directory: terraform/envs/staging
        env:
          # Absolute path so every module spawned by run --all can resolve it.
          TF_CLI_ARGS_apply:   "-var-file=${{ github.workspace }}/staging.tfvars"
          TF_CLI_ARGS_destroy: "-var-file=${{ github.workspace }}/staging.tfvars"
        run: |
          terragrunt run --all --non-interactive \
            ${{ inputs.action == 'create' && 'apply' || 'destroy' }}

  # ───────────────────────────────────────────────────────────────────────────
  # Job 3 · Production Environment — Terragrunt run --all
  # ───────────────────────────────────────────────────────────────────────────
  production:
    name: "Production · ${{ inputs.action == 'create' && 'Apply' || 'Destroy' }}"
    needs: [shared]
    if: inputs.production == true && (needs.shared.result == 'success' || needs.shared.result == 'skipped')
    runs-on: ubuntu-latest

    env:
      TF_NETWORK_SA:  ${{ vars.TF_NETWORK_SA }}
      TF_PLATFORM_SA: ${{ vars.TF_PLATFORM_SA }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}

    steps:
      - name: Checkout — ${{ inputs.branch }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Authenticate to GCP via WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CICD_SA }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Setup Terragrunt
        run: |
          curl -sL \
            "https://github.com/gruntwork-io/terragrunt/releases/latest/download/terragrunt_linux_amd64" \
            -o /usr/local/bin/terragrunt
          chmod +x /usr/local/bin/terragrunt
          terragrunt --version

      - name: Write production.tfvars
        env:
          TFVARS_CONTENT: ${{ secrets.PRODUCTION_TFVARS }}
        run: echo "$TFVARS_CONTENT" > "$GITHUB_WORKSPACE/production.tfvars"

      - name: Terragrunt ${{ inputs.action == 'create' && 'Apply' || 'Destroy' }}
        working-directory: terraform/envs/production
        env:
          TF_CLI_ARGS_apply:   "-var-file=${{ github.workspace }}/production.tfvars"
          TF_CLI_ARGS_destroy: "-var-file=${{ github.workspace }}/production.tfvars"
        run: |
          terragrunt run --all --non-interactive \
            ${{ inputs.action == 'create' && 'apply' || 'destroy' }}

  # ───────────────────────────────────────────────────────────────────────────
  # Job 4 · DDoS Simulation — Terragrunt (single unit)
  # ───────────────────────────────────────────────────────────────────────────
  ddos_simulation:
    name: "DDoS Simulation · ${{ inputs.action == 'create' && 'Apply' || 'Destroy' }}"
    needs: [shared, staging, production]
    if: >-
      inputs.ddos_simulation == true &&
      (needs.shared.result == 'success' || needs.shared.result == 'skipped') &&
      (needs.staging.result == 'success' || needs.staging.result == 'skipped') &&
      (needs.production.result == 'success' || needs.production.result == 'skipped')
    runs-on: ubuntu-latest

    env:
      TF_NETWORK_SA:  ${{ vars.TF_NETWORK_SA }}
      TF_PLATFORM_SA: ${{ vars.TF_PLATFORM_SA }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}

    steps:
      - name: Checkout — ${{ inputs.branch }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Authenticate to GCP via WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CICD_SA }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Setup Terragrunt
        run: |
          curl -sL \
            "https://github.com/gruntwork-io/terragrunt/releases/latest/download/terragrunt_linux_amd64" \
            -o /usr/local/bin/terragrunt
          chmod +x /usr/local/bin/terragrunt
          terragrunt --version

      # Write tfvars into the unit directory so terragrunt's optional_var_files
      # (= "${get_terragrunt_dir()}/.tfvars") picks it up automatically.
      - name: Write ddos-simulation .tfvars
        env:
          TFVARS_CONTENT: ${{ secrets.DDOS_SIMULATION_TFVARS }}
        run: echo "$TFVARS_CONTENT" > "terraform/ddos-simulation/staging/.tfvars"

      - name: Terragrunt ${{ inputs.action == 'create' && 'Apply' || 'Destroy' }}
        working-directory: terraform/ddos-simulation/staging
        run: |
          terragrunt run --all --non-interactive \
            ${{ inputs.action == 'create' && 'apply' || 'destroy' }}