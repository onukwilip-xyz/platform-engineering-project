name: "Shared Infrastructure"

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform"
        type: choice
        options:
          - apply
          - destroy
        default: apply

jobs:
  deploy:
    uses: ./.github/workflows/terraform-pipeline.yml
    secrets: inherit
    with:
      github-environment: "shared"
      connect-vpn: false
      action: ${{ inputs.action }}
      iac-tool: "terraform"
      working-directory: "terraform/shared"
      gcp-project-id: ${{ vars.TF_PROJECT }}