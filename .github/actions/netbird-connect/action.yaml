# Installs NetBird, fetches the setup key from GSM, joins the mesh, and waits until the tunnel is fully ready.

# Usage:
#   - name: Connect to NetBird VPN
#     uses: ./.github/actions/netbird-connect
#     with:
#       netbird-version: "0.67.0"
#       management-url: ${{ vars.NETBIRD_MANAGEMENT_URL }}
#       setup-key-secret: ${{ vars.NETBIRD_CICD_KEY_SECRET }}
#       gcp-project-id: ${{ vars.TF_PROJECT }}

name: "NetBird Connect"
description: "Installs the NetBird client, retrieves the setup key from GSM, and connects the runner to the NetBird mesh network."

inputs:
  netbird-version:
    description: "NetBird client version to install (e.g. 0.67.0)"
    required: false
    default: "0.67.0"
  management-url:
    description: "Full URL of the NetBird management server (e.g. https://vpn.example.com:443)"
    required: true
  setup-key-secret:
    description: "Bare secret name in GSM holding the NetBird CI/CD setup key"
    required: true
  gcp-project-id:
    description: "GCP project ID where the GSM secret lives"
    required: true

runs:
  using: "composite"
  steps:

    - name: Install NetBird client
      shell: bash
      env:
        NB_VERSION: ${{ inputs.netbird-version }}
      run: |
        curl -fsSL \
          "https://github.com/netbirdio/netbird/releases/download/v${NB_VERSION}/netbird_${NB_VERSION}_linux_amd64.tar.gz" \
          | sudo tar -xz -C /usr/local/bin netbird
        sudo netbird service install
        sudo netbird service start

    - name: Retrieve NetBird setup key from Secret Manager
      id: netbird-key
      shell: bash
      env:
        SECRET_NAME: ${{ inputs.setup-key-secret }}
        PROJECT_ID: ${{ inputs.gcp-project-id }}
        # tf-network already has Secret Admin on the host project; every CI/CD
        # SA already has serviceAccountTokenCreator on it (terraform/README.md).
        # Impersonating avoids needing a per-CI/CD-SA grant on this secret.
        IMPERSONATE_SA: ${{ vars.TF_NETWORK_SA_EMAIL }}
      run: |
        KEY=$(gcloud secrets versions access latest \
          --secret="$SECRET_NAME" \
          --project="$PROJECT_ID" \
          --impersonate-service-account="$IMPERSONATE_SA")
        echo "::add-mask::$KEY"
        echo "key=$KEY" >> "$GITHUB_OUTPUT"

    - name: Connect to NetBird mesh
      shell: bash
      env:
        SETUP_KEY: ${{ steps.netbird-key.outputs.key }}
        MANAGEMENT_URL: ${{ inputs.management-url }}
        GHA_RUN_ID: ${{ github.run_id }}
        GHA_JOB: ${{ github.job }}
      run: |
        sudo netbird up \
          --management-url "$MANAGEMENT_URL" \
          --setup-key      "$SETUP_KEY" \
          --hostname       "gha-${GHA_RUN_ID}-${GHA_JOB}"

    - name: Wait for NetBird mesh to be ready
      shell: bash
      run: |
        for i in $(seq 1 24); do
          STATUS=$(sudo netbird status 2>/dev/null || true)
          MGMT=$(echo "$STATUS" | grep "Management:" | awk '{print $2}')
          SIG=$(echo "$STATUS"  | grep "Signal:"     | awk '{print $2}')
          [ "$MGMT" = "Connected" ] && [ "$SIG" = "Connected" ] && \
            echo "Mesh ready after $((i * 5))s" && sudo netbird status && exit 0
          echo "  [${i}/24] Mgmt=${MGMT:-?} Sig=${SIG:-?} — retrying in 5s..."
          sleep 5
        done
        echo "ERROR: NetBird did not connect within 120s" && exit 1